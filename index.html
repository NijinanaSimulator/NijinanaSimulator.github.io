<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'self'; frame-src 'self' file:; base-uri 'none'; form-action 'none'">
<title>NijinanaSimulator</title>
<meta name="description" content="にじなな用の非公式・手動シミュレーター。カード登録、デッキ編集、盤面操作、リプレイの記録と再生に対応しています。">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="deck-manager.css">
</head>
<body data-page="board">
<header class="app-header">
<div class="brand"><span class="brand-icon" aria-hidden="true">7</span><div><div class="brand-line">にじなな シミュレーター（非公式）</div><h1>NijinanaSimulator</h1></div></div>
<div class="header-actions">
<button data-action="catalog">カード登録</button><button data-action="deck-editor">デッキを選ぶ</button><a class="app-link" href="deck/">デッキ管理</a><button data-action="save" class="primary">JSON保存</button><button data-action="load">読込</button><button data-action="help" class="ghost">使い方</button>
</div>
</header>
<div class="subbar"><span>一人回しのための非公式ツール · カード効果は手動で処理</span><span id="saveStatus" class="status">ブラウザ内の保存領域を確認中</span></div>
<main class="layout"><aside id="sidePanel" class="sidebar"><div class="mobile-only mobile-panel-heading"><strong id="mobilePanelTitle">基本操作</strong><button data-action="mobile-close">盤面に戻る</button></div><div id="sideHead" class="side-head"></div><div id="sideTabs" class="tabs"></div><div id="sideContent" class="side-content"></div><div class="version">v0.3.0 · オフライン対応 · ライトテーマ</div></aside><div class="table-content"><section id="replayBar" class="replay-bar" aria-label="リプレイ"></section><nav id="phaseStrip" class="phase-strip" aria-label="フェイズ表示（効果処理なし）"></nav><div id="board" class="board"></div><p class="table-footnote">参考画像に合わせた配置です。フェイズは表示のみを切り替えます。</p></div></main>
<button class="mobile-panel-backdrop" data-action="mobile-close" aria-label="操作欄を閉じる" tabindex="-1"></button>
<nav id="mobileNav" class="mobile-nav" aria-label="スマホ用の盤面操作">
<button data-action="mobile-close">盤面</button>
<button data-action="mobile-panel" data-tab="operation" aria-controls="sidePanel" aria-expanded="false">基本操作</button>
<button data-action="mobile-panel" data-tab="selection" aria-controls="sidePanel" aria-expanded="false">選択<span id="mobileSelectionCount" class="mobile-selection-count" aria-live="polite">0枚</span></button>
<button data-action="mobile-panel" data-tab="history" aria-controls="sidePanel" aria-expanded="false">履歴</button>
</nav>
<div id="replayCutIn" class="replay-cut-in" aria-live="polite" hidden></div>
<dialog id="modal"><div class="modal-heading"><h2 id="modalTitle"></h2><div class="modal-heading-actions"><button id="modalBack" data-action="preview-return" hidden>一覧に戻る</button><button data-action="close-modal" aria-label="閉じる">閉じる</button></div></div><div id="modalContent" class="modal-content"></div></dialog>
<input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<input id="statePicker" type="file" accept=".json,application/json" hidden>
<input id="cardLibraryPicker" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input id="replayPicker" type="file" accept=".json,application/json" hidden>
<input id="deckTxtPicker" type="file" accept=".txt,text/plain" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app-navigation.js"></script>
<script src="app.js"></script>
<script src="deck-storage.js"></script>
<script src="json-export.js"></script>
<script src="deck-txt.js"></script>
<script src="deck-manager.js"></script>

</body>
</html>
