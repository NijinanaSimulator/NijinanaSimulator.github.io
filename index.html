<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>NijinanaSimulator</title>
<style>
:root{color-scheme:light;--ink:#273649;--muted:#61768a;--line:#dbe3ec;--navy:#325978;--blue:#edf4fa;--paper:#fff;--shadow:0 5px 18px #2b435508}
*{box-sizing:border-box}
body{margin:0;background:#f0f4f8;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;font-size:13px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{border:1px solid #cfdae5;border-radius:7px;background:#fff;color:#425970;padding:7px 10px;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{background:#edf4fa;border-color:#96acc1}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:650}
button.primary:hover{background:#254864;border-color:#254864}
button.danger{color:#a44b52;border-color:#e7cdd0}
button.small{padding:3px 8px;font-size:12px}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4e91bd;outline-offset:3px}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid #cfdbe6;border-radius:6px;padding:7px 8px;max-width:100%;accent-color:var(--navy)}
input[type=number]{width:64px;font-variant-numeric:tabular-nums}
input[type=checkbox]{vertical-align:middle}
textarea{width:100%;resize:vertical;min-height:70px}
label{display:block;color:#536b80;font-size:12px}
h1,h2,h3,p{margin:0}
h1{font-size:19px;letter-spacing:.03em;font-weight:750;color:#263c50}
h2{font-size:17px;font-weight:700}
h3{font-size:12px;letter-spacing:.04em;font-weight:700;margin-bottom:9px;color:#476179}
small,.muted{color:var(--muted);font-size:11px}
header.app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 25px 15px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.brand-icon{display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:29px;font-weight:800;letter-spacing:-1px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,#e88b9a,#e5ad78,#d8c660,#83b590,#82b7cc,#93a7d4,#b199cc) border-box;color:#365873;line-height:1;min-width:42px;width:42px;height:42px;border:2px solid transparent;border-bottom-width:4px;border-radius:9px;box-shadow:0 2px 7px #334f6510}
.brand-line{font-size:9px;font-weight:650;letter-spacing:.18em;color:#71879a;margin-bottom:3px}
.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.header-actions button{font-size:12px}
.subbar{display:flex;justify-content:space-between;gap:10px;padding:7px 25px;background:#f7f9fc;border-bottom:1px solid #e4eaf1;color:#7b8b9b;font-size:10px;flex-wrap:wrap}
.status{color:#528878}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;padding:18px 24px 28px;max-width:1680px;margin:auto;align-items:start}
aside.sidebar{background:#fff;border:1px solid var(--line);border-radius:11px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;box-shadow:var(--shadow)}
.side-head{padding:16px 14px 13px;border-bottom:1px solid #e6edf3}
.player-switch{display:flex;gap:5px;margin-top:9px}
.player-switch button{flex:1;font-size:11px;padding:6px 5px}
.player-switch button.current{border-color:#aec5d8;background:#eaf2f9;color:#315c7b;font-weight:650}
.tabs{display:flex;padding:5px 7px 0;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:4px 4px 0 0;background:none;color:#627c92;font-size:12px;padding:10px 3px}
.tabs button.active{border-bottom-color:#46799e;background:#f3f7fb;color:#325a79;font-weight:700}
.side-content{padding:15px 14px}
.control-group{margin-bottom:21px}
.control-group:last-child{margin-bottom:0}
.control-row{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.control-row label{flex:1}
.control-row .grow{flex:1}
.control-row button{font-size:12px}
.board-controls{display:flex;flex-direction:column;gap:8px}
.board-controls>h3{margin-bottom:0}
.board-controls>.control-row{margin-top:0;flex-wrap:nowrap}
.board-controls>button{font-size:11px}
.board-controls #initialCount{width:48px;min-width:0}
.board-controls [data-action="redeal"]{padding-left:5px;padding-right:5px;font-size:11px}
.history-toolbar{margin-bottom:12px}
.full{width:100%}
.help-note{font-size:11px;color:#64788b;line-height:1.8;margin-top:9px}
.turn-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:#536e83;font-size:12px}
.undo-row{display:flex;gap:5px;margin-top:12px}
.undo-row button{flex:1;font-size:11px}
.table-content{min-width:0;display:flex;flex-direction:column;gap:11px}
.table-content>.phase-strip{border:1px solid #dce5ee;border-radius:9px;box-shadow:var(--shadow)}
.table-footnote{font-size:11px;color:#6d8295;padding:0 3px;line-height:1.8}
.board{display:flex;flex-direction:column;gap:16px;min-width:0}
.player-panel{border:1px solid #d9e3ed;border-radius:11px;overflow:hidden;background:#fff;min-width:0;box-shadow:var(--shadow)}
.player-panel.active-player{border-color:#b8ccdc}
.player-heading{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f9fbfd;border-bottom:1px solid #e4ebf2;gap:8px;flex-wrap:wrap}
.player-heading .name{font-weight:700;font-size:13px;color:#36516a}
.player-heading .badge{font-size:9px;font-weight:500;padding:2px 7px;border:1px solid #d2dfea;background:#fff;border-radius:12px;margin-left:7px;color:#7690a6}
.player-panel.active-player .badge{border-color:#c5dccc;background:#f1f8f3;color:#639071}
.meters{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.meter{display:flex;gap:5px;align-items:center;color:#617b92;font-size:11px}
.meter output{min-width:24px;text-align:center;color:#35546d;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.meter button{padding:0 6px;line-height:20px;border-color:#dce5ed;background:#fff}
.phase-strip{display:flex;align-items:center;gap:4px;padding:9px 12px;background:#fff;border-bottom:1px solid #e9eef4}
.phase-button{position:relative;flex:1;min-width:0;border:1px solid #e2e9f0;background:#f6f8fb;color:#59748a;font-size:12px;padding:7px 8px;border-radius:5px;white-space:nowrap}
.phase-button>span{margin-right:6px;color:#7c94a8;font-size:11px;font-weight:650}
.phase-button>small{margin-left:6px;font-size:10px;color:#788fa3}
.phase-button.is-current{background:#365f7e;color:#fff;border-color:#365f7e;font-weight:700}
.phase-button.is-current>span,.phase-button.is-current>small{color:#deebf4}
.phase-button.is-current:hover{background:#2b536f;border-color:#2b536f}
.phase-button:hover{background:#edf3f8}
.playmat-scroll{overflow-x:auto;padding:12px;background:#fcfdff;scrollbar-width:thin;scrollbar-color:#c2d1df transparent}
.playmat{display:grid;grid-template-columns:94px repeat(3,minmax(138px,1fr)) 122px;grid-template-rows:170px 158px 160px 159px;grid-template-areas:"colorline field field field deck" "colorline set channel stage discard" "colorline hand hand hand hand" "niji niji niji niji niji";gap:9px;min-width:780px}
.playmat>.hand-zone{grid-area:hand;margin:0}
.zone{border:1px solid #dce5ee;border-radius:8px;min-width:0;background:#f8fafc;min-height:150px;transition:border-color .12s,background .12s,box-shadow .12s}
.playmat>.zone{min-height:0;display:flex;flex-direction:column}
.zone.drag-over{border-color:#639fc6;background:#e8f3fb;box-shadow:inset 0 0 0 1px #639fc6}
.zone-deck,.zone-discard{cursor:pointer}
.zone-head{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:7px 9px 4px;color:#3b5368;font-size:12px;min-height:29px}
.zone-head span.zone-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650;letter-spacing:.02em}
.zone-head button{padding:1px 5px;line-height:18px;font-size:10px;color:#698399;background:#ffffffbf;border-color:#d4e0e9;font-weight:500}
.zone-head button:hover{color:#446e8f;border-color:#a6bdce;background:#fff}
.zone-count{display:inline-block;color:#71889b;margin-left:5px;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.zone-en{color:#889eaf;font-size:8px;font-weight:500;letter-spacing:.12em;margin-left:5px;white-space:nowrap}
.zone-title>.zone-en{display:block;margin-left:0;line-height:1.5;margin-bottom:1px}
.zone-cards{display:flex;gap:7px;align-items:center;padding:4px 9px 9px;min-height:116px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#cbd8e3 transparent}
.playmat>.zone>.zone-cards{flex:1;min-height:0}
.zone-cards.pile{justify-content:center;position:relative}
.zone-cards.pile .card{box-shadow:3px 3px #d7e2ec,6px 6px #e7edf4;margin-right:6px;margin-bottom:6px}
.zone-empty{width:100%;align-self:center;color:#8ba0b2;text-align:center;font-size:11px;user-select:none;letter-spacing:.02em}
.slot-placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;flex:0 0 auto;width:72px;height:104px;max-width:100%;border:1px dashed #d3dfe9;border-radius:6px;color:#afbdc9;background:#ffffff30;font-size:9px;text-align:center;letter-spacing:.03em;line-height:1.9;user-select:none}
.zone-field{grid-area:field;background:#f0f6fb;border-color:#d6e5f0}
.zone-field .zone-cards{justify-content:safe center;gap:13px}
.zone-field .zone-head{color:#3b5368}
.zone-set{grid-area:set}
.zone-channel{grid-area:channel;background:#f4f7fc}
.zone-stage{grid-area:stage;background:#f6f4fb;border-color:#e3dff0}
.zone-set .zone-cards,.zone-channel .zone-cards,.zone-stage .zone-cards{justify-content:safe center}
.zone-channel .card,.zone-channel .slot-placeholder{width:130px;height:90px}
.zone-channel .card img{object-fit:contain}
.zone-channel .card .card-body{padding:8px}
.zone-deck{grid-area:deck;background:#f5f8fc}
.zone-discard{grid-area:discard;background:#f7f8fb}
.zone-colorline{grid-area:colorline;background:#f9fbfe;border-color:#dce5ee}
.zone-colorline .zone-head{flex-wrap:wrap;justify-content:center;padding:7px 3px 3px;gap:1px}
.zone-colorline .zone-head .zone-title{font-size:10px;letter-spacing:0}
.zone-colorline .zone-en{display:none}
.zone-colorline .zone-head button{font-size:10px;line-height:16px;padding:0 4px}
.zone-colorline .zone-cards{flex-direction:column;justify-content:space-evenly;padding:5px 4px 8px;gap:3px;overflow-y:auto;overflow-x:hidden}
.colorline-slot{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;flex:1}
.colorline-slot>span,.colorline-number,.slot-number{font-size:11px;font-weight:650;color:#7a91a5;font-variant-numeric:tabular-nums;min-width:9px;text-align:center}
.colorline-slot .card,.colorline-slot .slot-placeholder{width:58px;height:40px;min-height:40px;border-radius:4px}
.colorline-slot .card .card-body{padding:4px;border-top-width:3px}
.colorline-slot .card .card-body strong{font-size:7px;line-height:1.3}
.colorline-slot .card .card-body .card-symbol{font-size:17px}
.colorline-slot .card.face-down{border-width:2px;background:linear-gradient(145deg,#eb9aa4 0%,#eab28a 17%,#e3d389 33%,#9ac5a8 48%,#96bfce 64%,#a0aed5 80%,#b4a1ce 100%)}
.colorline-slot .card.face-down .back-mark{width:23px;height:23px;border-color:#ffffffa3;background:#ffffff1c;color:#fff;font-size:10px}
.colorline-slot .slot-placeholder{border-color:#d8e1ea;background:#f0f4f8;font-size:8px}
.niji-area{grid-area:niji;min-width:0;display:flex;flex-direction:column;gap:5px}
.niji-heading{color:#4c697f;font-size:12px;font-weight:650;letter-spacing:.04em;padding-left:2px;line-height:18px}
.niji-heading .zone-en{color:#a2b1bf;font-weight:500}
.niji-heading>span:first-child{font-size:8px;letter-spacing:.13em;color:#97a8b7;margin-right:8px}
.niji-letter{font-size:43px;font-weight:300;line-height:1;color:var(--niji-accent);opacity:.44;text-align:center;width:100%;align-self:center;user-select:none}
.niji-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;flex:1;min-height:0}
.niji-grid .zone{min-height:0;display:flex;flex-direction:column;border-radius:6px;border-color:var(--niji-border);background:var(--niji-bg);border-top:4px solid var(--niji-accent)}
.niji-grid .zone-head{color:var(--niji-ink);padding:4px 5px 0;min-height:24px;gap:1px;flex-wrap:wrap}
.niji-grid .zone-head span.zone-title{font-size:11px;color:#3b5368}
.niji-grid .zone-head button{font-size:10px;line-height:16px;padding:0 3px;border-color:var(--niji-border);color:var(--niji-ink)}
.niji-grid .zone-count{color:var(--niji-ink);opacity:.85;margin-left:3px;font-size:11px}
.niji-grid .zone-en{display:none}
.niji-grid .zone-cards{justify-content:safe center;flex:1;min-height:0;padding:3px 3px 6px;gap:3px}
.niji-grid .card{width:59px;height:85px}
.niji-grid .slot-placeholder{width:57px;height:80px;border-color:var(--niji-border);color:var(--niji-ink);opacity:.5}
.niji-grid .zone-empty{color:var(--niji-ink);opacity:.45;font-size:9px}
.niji-grid .zone-empty.niji-letter{font-size:34px;color:var(--niji-accent);opacity:.45;font-weight:400;line-height:1}
.zone-niji_r{--niji-bg:#fff3f4;--niji-border:#edc4cd;--niji-accent:#db8294;--niji-ink:#aa5f71}
.zone-niji_o{--niji-bg:#fff6ef;--niji-border:#ecccb4;--niji-accent:#de9d6d;--niji-ink:#a77a53}
.zone-niji_y{--niji-bg:#fffbed;--niji-border:#e4d79f;--niji-accent:#cfb85b;--niji-ink:#958442}
.zone-niji_g{--niji-bg:#f0f8f1;--niji-border:#bedbc4;--niji-accent:#83b690;--niji-ink:#5d8768}
.zone-niji_b{--niji-bg:#f0f8fb;--niji-border:#bcdce9;--niji-accent:#71adc6;--niji-ink:#537f93}
.zone-niji_i{--niji-bg:#f1f4fc;--niji-border:#c3d0ed;--niji-accent:#859dce;--niji-ink:#657dac}
.zone-niji_v{--niji-bg:#f7f2fb;--niji-border:#d4c4e7;--niji-accent:#a98acb;--niji-ink:#84689e}
.zone-grid{padding:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.extra-zones{border-top:1px solid #e6edf3;background:#fbfcfe}
.extra-zones>summary{cursor:pointer;color:#8698a8;font-size:11px;padding:10px 13px}
.hand-zone{margin:0 12px 12px;min-height:140px;background:#f9fbfd;border-color:#dce5ee}
.hand-zone .zone-head{padding:7px 10px 2px}
.hand-zone .zone-cards{min-height:110px;padding:5px 10px 9px;gap:8px}
.hand-zone .card{width:70px;height:101px}
.hand-zone .zone-empty{font-size:11px}
.card{position:relative;width:72px;height:104px;flex:0 0 auto;border:1px solid #bbccda;border-radius:6px;background:#eff4f8;color:#355974;overflow:hidden;cursor:grab;user-select:none;padding:0;box-shadow:0 2px 4px #3c59721a;outline-offset:2px;display:flex;align-items:center;justify-content:center}
.card:hover{border-color:#769ab7;background:#e8f1f8;box-shadow:0 3px 8px #4666812a}
.card.selected{outline:2px solid #5e9fc7;border-color:#fff;box-shadow:0 0 0 3px #d7eaf6}
.card:active{cursor:grabbing}
.card img{width:100%;height:100%;object-fit:contain;background:#fff;pointer-events:none}
.card .card-body{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:7px;text-align:center;border-top:4px solid #8ba9bf;pointer-events:none;background:linear-gradient(145deg,#f7fafc,#e9f1f7)}
.card .card-body strong{font-size:10px;word-break:break-all;line-height:1.45;font-weight:650;color:#49667f}
.card .card-body .card-symbol{font-size:25px;color:#9bb5c8;align-self:center;line-height:1}
.card.face-down{background:repeating-linear-gradient(45deg,#e1eaf3,#e1eaf3 4px,#d8e4ee 4px,#d8e4ee 10px);border:3px solid #b3c6d7}
.card.face-down .back-mark{border:1px solid #a5bccf;border-radius:50%;width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#93aec4;font-size:15px;background:#e8f0f63b;pointer-events:none}
.card .rotated-label{position:absolute;bottom:3px;right:3px;font-size:9px;background:#fffefa;padding:1px 4px;border-radius:3px;color:#688299;border:1px solid #d8e1e9;pointer-events:none}
.card.rotated img,.card.rotated .card-body,.card.rotated .back-mark{transform:rotate(90deg) scale(.72)}
/* Field cards rotate at full size; margins reserve the extra width (104 - 72). */
.zone-field .card.rotated{transform:rotate(90deg);margin-inline:16px}
.zone-field .card.rotated img,.zone-field .card.rotated .card-body,.zone-field .card.rotated .back-mark{transform:none}
.card .counter-badge{position:absolute;top:3px;right:3px;min-width:18px;border-radius:10px;background:#f3db9b;color:#866728;font-size:10px;font-weight:700;padding:1px 4px;pointer-events:none;text-align:center}
.card .note-badge{position:absolute;bottom:4px;left:4px;width:7px;height:7px;background:#78a8c8;border:1px solid #fff;border-radius:50%;pointer-events:none}
.selected-preview{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.selected-preview .card{width:70px;height:101px}
.selected-preview .selection-title{font-size:12px;word-break:break-all;color:#47637a}
.tag{display:inline-block;font-size:10px;padding:2px 7px;background:#edf3f8;border-radius:4px;color:#6b849a;margin-top:5px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.choice-grid button{padding:7px 4px;font-size:12px}
.log-item{padding:8px 0;border-bottom:1px solid #e8edf2;font-size:11px;color:#688094;word-break:break-word}
.log-item time{display:block;font-size:9px;color:#a0aebc;margin-bottom:2px}
.empty-help{padding:12px;border:1px dashed #cbdce9;background:#f8fbfd;border-radius:7px;color:#637d92;line-height:1.9;font-size:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#35566f;color:#fff;box-shadow:0 8px 28px #344d692b;border-radius:9px;padding:12px 19px;font-size:13px;max-width:min(90vw,780px);z-index:20;display:none}
#toast.error{background:#a7575d;color:#fff}
dialog{border:1px solid #d0dce7;border-radius:13px;background:#fff;color:var(--ink);padding:0;width:min(920px,94vw);max-height:90vh;box-shadow:0 25px 100px #30475f35}
dialog::backdrop{background:#32465e73;backdrop-filter:blur(3px)}
.modal-heading{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #e0e8ef;position:sticky;top:0;background:#f8fbfd;z-index:3;gap:12px}
.modal-heading-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.modal-heading-actions [hidden]{display:none}
.modal-content{padding:19px 20px;overflow:auto}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.modal-toolbar label{display:flex;align-items:center;gap:7px}
.catalog-row{display:grid;grid-template-columns:45px minmax(120px,1fr) 190px 80px;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #e2eaf1}
.catalog-row input[type=text]{width:100%}
.mini-card{width:36px;height:52px;border:1px solid #c4d3e0;border-radius:4px;object-fit:contain;background:#edf4f9;display:flex;align-items:center;justify-content:center;color:#8ca8bb;font-size:12px}
.zone-inspect-grid{display:flex;flex-wrap:wrap;gap:14px;margin-top:15px;max-height:45vh;overflow:auto;padding:4px}
.zone-inspect-grid.drag-over{background:#e8f3fb;outline:2px solid #639fc6;outline-offset:2px;border-radius:5px}
.inspect-item{display:flex;flex-direction:column;align-items:center;width:98px;gap:6px}
.inspect-item .card{width:91px;height:131px}

<script>
const byId = id => document.getElementById(id)

const playerIds = ["p1", "p2"]
const nijiColors = ["R", "O", "Y", "G", "B", "I", "V"]
const textCardTypes = {other: "未設定", liver: "ライバーカード", event: "イベントカード", stage: "ステージカード", channel: "チャンネルカード"}
const textCardClasses = ["太陽", "月", "彗星", "星"]
// CARD_LIBRARY_START
// Offline XLSX import. Card effects remain plain text and never run as rules.
const XLSX_CARD_LIMITS = {fileBytes: 10 * 1024 * 1024, entryBytes: 20 * 1024 * 1024, totalBytes: 50 * 1024 * 1024, entries: 2000, rows: 20000, cells: 250000, cards: 1000}
const XLSX_CARD_HEADERS = ["仮ID", "カード名", "種類", "クラス", "Lv", "Power"]
const XLSX_CARD_TYPES = {LIVER: "liver", ライバー: "liver", ライバーカード: "liver", EVENT: "event", イベント: "event", イベントカード: "event", STAGE: "stage", ステージ: "stage", ステージカード: "stage", CHANNEL: "channel", チャンネル: "channel", チャンネルカード: "channel"}
const XLSX_CARD_CLASSES = {SOL: "太陽", LUNA: "月", COMET: "彗星", STELLA: "星", 太陽: "太陽", 月: "月", 彗星: "彗星", 星: "星"}
const XLSX_CARD_COLOR_HEADERS = ["colors", "color", "色", "カラー", "ライバーの色"]
const XLSX_CARD_COLOR_ORDER = ["R", "O", "Y", "G", "B", "I", "V"]
const XLSX_CARD_COLORS = {R: "R", O: "O", Y: "Y", G: "G", B: "B", I: "I", V: "V", 赤: "R", 橙: "O", 黄: "Y", 緑: "G", 青: "B", 藍: "I", 紫: "V"}

function xlsxCardCellValue(cell) {
    return cell && typeof cell === "object" && cell.formula === true ? cell.value : cell
}

function xlsxCardHeaderColumns(values) {
    const labels = values.map(value => String(xlsxCardCellValue(value) ?? "").trim().toLowerCase())
    const columns = XLSX_CARD_HEADERS.map(label => labels.indexOf(label.toLowerCase()))
    return columns.every(index => index >= 0) ? columns : null
}

function normalizeXlsxCardColors(cell, fail) {
    const value = xlsxCardCellValue(cell)
    if (cell?.formula === true && (value === null || value === undefined)) fail("色の数式の計算結果がありません。Excel で計算して保存してください。")
    if (value === null || value === undefined || (typeof value === "string" && !value.trim())) return []
    if (typeof value !== "string" || value.length > 200) fail("色は R・O・Y・G・B・I・V または赤・橙・黄・緑・青・藍・紫で入力してください。")
    const tokens = value.normalize("NFKC").toUpperCase().replace(/[\s,、・/|]+/g, "")
    const colors = new Set()
    for (const token of tokens) {
        if (!Object.hasOwn(XLSX_CARD_COLORS, token)) fail(`色欄の「${token}」に対応していません。7色の記号または色名を使ってください。`)
        colors.add(XLSX_CARD_COLORS[token])
    }
    return XLSX_CARD_COLOR_ORDER.filter(color => colors.has(color))

// rows: [{rowNumber: 1, values: ["仮ID", "カード名", ...]}, ...].
// Formula cells may use {formula: true, value: cachedValueOrNull}; no formula runs.
function normalizeCardLibraryRows(rows, sourceName, sheetName) {
    if (!Array.isArray(rows) || rows.length > XLSX_CARD_LIMITS.rows) throw new Error("Excel の行数が読み込み上限を超えています。")

    const columns = xlsxCardHeaderColumns(rows[headerIndex].values)
    const effectColumn = rows[headerIndex].values.findIndex(value => ["効果", "効果テキスト", "効果本文"].includes(String(xlsxCardCellValue(value) ?? "").trim()))

        if (!Array.isArray(row.values) || !Number.isInteger(rowNumber) || rowNumber < 1) fail("行の形式が正しくありません。")
        const cells = columns.map(index => row.values[index])
        const values = cells.map(xlsxCardCellValue)
        const empty = value => value === null || value === undefined || (typeof value === "string" && !value.trim())
        if (values.every(empty)) continue

        // its card rows. A row without a card name and type is not card data.
        if (empty(values[1]) && empty(values[2]) && cells[0]?.formula === true && values.slice(1).every(empty)) continue
        cells.forEach((cell, index) => {
            if (cell?.formula === true && empty(cell.value)) fail(`${XLSX_CARD_HEADERS[index]} の数式の計算結果がありません。Excel で計算して保存してください。`)
        })
        const readText = (value, label, maximum, required = false) => {
            if (empty(value)) {
                if (required) fail(`${label}が空欄です。`)
                return ""
            }
            if (typeof value !== "string" || value.length > maximum) fail(`${label}の文字列が正しくありません。`)
            return value.trim()
        }
        const key = readText(values[0], "仮ID", 100, true)
        if (!/^[A-Za-z0-9_-]+$/.test(key)) fail("仮IDには半角英数字・ハイフン・アンダーバーを使ってください。")
        if (["__proto__", "prototype", "constructor"].includes(key)) fail("この仮IDは使用できません。別の仮IDに変更してください。")
        if (keys.has(key)) fail(`仮ID「${key}」が重複しています。`)
        const name = readText(values[1], "カード名", 200, true)
        const rawType = readText(values[2], "種類", 40, true).toUpperCase()
        const rawClass = readText(values[3], "クラス", 40).toUpperCase()
        if (!Object.hasOwn(XLSX_CARD_TYPES, rawType)) fail(`種類「${rawType}」に対応していません。`)
        if (rawClass && !Object.hasOwn(XLSX_CARD_CLASSES, rawClass)) fail(`クラス「${rawClass}」に対応していません。`)
        const number = (value, label, maximum) => {
            if (empty(value)) return null
            if (typeof value === "string" && /^\d+(?:\.0+)?$/.test(value.trim())) value = Number(value.trim())
            if (typeof value !== "number" || !Number.isInteger(value) || value < 0 || value > maximum) fail(`${label}は 0 ～ ${maximum} の整数にしてください。`)
            return value
        }
        const cardType = XLSX_CARD_TYPES[rawType]
        const cost = number(values[4], "Lv", 999)
        const power = number(values[5], "Power", 999999)
        const effectCell = effectColumn < 0 ? null : row.values[effectColumn]
        const effectValue = xlsxCardCellValue(effectCell)
        if (effectCell?.formula === true && (effectValue === null || effectValue === undefined)) fail("効果の数式の計算結果がありません。Excel で計算して保存してください。")
        const text = effectValue ?? ""
        if (typeof text !== "string" || text.length > 10000) fail("効果は 10000 文字以内の文章にしてください。")
        const colors = cardType === "liver" && colorColumn >= 0 ? normalizeXlsxCardColors(row.values[colorColumn], fail) : []
        keys.add(key)
        cards.push({key, name, text, cardType, className: rawClass ? XLSX_CARD_CLASSES[rawClass] : "", colors, cost: cardType === "channel" ? null : cost, power: cardType === "liver" ? power : null, sourceRow: rowNumber})
        if (cards.length > XLSX_CARD_LIMITS.cards) fail(`カードは ${XLSX_CARD_LIMITS.cards} 件まで読み込めます。`)
    }
    if (!cards.length) throw new Error(`「${sheetName}」に読み込めるカードがありません。`)
    return {source: String(sourceName || "カードリスト.xlsx"), sourceSheet: sheetName, cards}
}

function xlsxCardCrc32(bytes) {
    let crc = 0xffffffff
    for (const byte of bytes) {
        crc ^= byte
        for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0)
    }
    return (crc ^ 0xffffffff) >>> 0
}

        if (disk) throw new Error("分割 ZIP 形式には対応していません。")

            cache.set(name, text)

}

function xlsxCardXml(text) {
    if (/<!DOCTYPE|<!ENTITY/i.test(text)) throw new Error("外部定義を含む XML には対応していません。")

    if (xml.getElementsByTagNameNS("*", "parsererror").length || xml.documentElement?.localName === "parsererror") throw new Error("Excel ファイル内の XML が壊れています。")
    return xml
}

function xlsxCardResolvePath(baseFile, target) {
    if (!target || /[\\\0?#]/.test(target) || /^[a-z][a-z\d+.-]*:/i.test(target) || target.startsWith("//")) throw new Error("Excel の外部参照には対応していません。")
    const parts = target.startsWith("/") ? [] : baseFile.split("/").slice(0, -1)
    for (const part of target.split("/")) {
        if (!part || part === ".") continue
        if (part === "..") {
            if (!parts.length) throw new Error("Excel ファイル内の参照先が正しくありません。")
            parts.pop()
        } else parts.push(part)
    }
    return parts.join("/")
}

function xlsxCardRelationships(xml, baseFile) {
    const relationships = new Map()
    for (const relation of xml.getElementsByTagNameNS("*", "Relationship")) {
        if ((relation.getAttribute("TargetMode") || "").toLowerCase() === "external") throw new Error("外部ファイルを参照する Excel には対応していません。")
        const id = relation.getAttribute("Id"), type = relation.getAttribute("Type") || "", target = xlsxCardResolvePath(baseFile, relation.getAttribute("Target"))
        if (!id || relationships.has(id)) throw new Error("Excel ファイル内の参照情報が正しくありません。")
        relationships.set(id, {type, target})
    }
    return relationships
}

function xlsxCardString(node) {
    if (!node) return ""
    let text = ""
    for (const child of node.children) {
        if (child.localName === "t") text += child.textContent
        else if (child.localName === "r") for (const run of child.children) if (run.localName === "t") text += run.textContent
    }
    return text
}

function xlsxCardSheetRows(xml, strings) {
    const rows = []
    let cellsSeen = 0
    for (const node of xml.getElementsByTagNameNS("*", "row")) {
        const rowNumber = Number(node.getAttribute("r"))
        if (!Number.isInteger(rowNumber) || rowNumber < 1 || rowNumber > 1048576) throw new Error("Excel の行番号が正しくありません。")
        const values = []
        for (const cell of node.children) {
            if (cell.localName !== "c") continue
            if (++cellsSeen > XLSX_CARD_LIMITS.cells) throw new Error("Excel のセル数が読み込み上限を超えています。")
            const reference = /^([A-Z]{1,3})([1-9]\d*)$/.exec(cell.getAttribute("r") || "")
            if (!reference || Number(reference[2]) !== rowNumber) throw new Error("Excel のセル参照が正しくありません。")
            let column = 0
            for (const character of reference[1]) column = column * 26 + character.charCodeAt(0) - 64
            if (column > 16384 || Object.hasOwn(values, column - 1)) throw new Error("Excel のセル参照が正しくありません。")
            const children = [...cell.children], raw = children.find(child => child.localName === "v")?.textContent ?? null, type = cell.getAttribute("t")
            let value = null
            if (type === "inlineStr") value = xlsxCardString(children.find(child => child.localName === "is"))
            else if (type === "s" && raw !== null) {
                const index = Number(raw)
                if (!Number.isInteger(index) || index < 0 || index >= strings.length) throw new Error("Excel の文字列参照が正しくありません。")
                value = strings[index]
            } else if (raw !== null) {
                if (!type || type === "n") value = raw.trim() ? Number(raw) : null
                else if (type === "b") value = raw === "1"
                else if (type === "e") value = {error: raw}
                else value = raw
            }
            values[column - 1] = children.some(child => child.localName === "f") ? {formula: true, value} : value
        }
        rows.push({rowNumber, values})
        if (rows.length > XLSX_CARD_LIMITS.rows) throw new Error("Excel の行数が読み込み上限を超えています。")
    }
    return rows
}

async function parseCardLibraryXlsx(buffer, sourceName) {
    const zip = await xlsxCardZip(buffer)
    const packageRelations = xlsxCardRelationships(xlsxCardXml(await zip.read("_rels/.rels")), "")
    const officeDocuments = [...packageRelations.values()].filter(relation => relation.type.endsWith("/officeDocument"))
    if (officeDocuments.length !== 1) throw new Error("Excel のブック情報が見つかりません。.xlsx ファイルを選んでください。")
    const workbookPath = officeDocuments[0].target, slash = workbookPath.lastIndexOf("/"), workbookRelationsPath = `${workbookPath.slice(0, slash + 1)}_rels/${workbookPath.slice(slash + 1)}.rels`
    const workbook = xlsxCardXml(await zip.read(workbookPath))
    const relations = xlsxCardRelationships(xlsxCardXml(await zip.read(workbookRelationsPath)), workbookPath)
    const sharedStringsRelation = [...relations.values()].find(relation => relation.type.endsWith("/sharedStrings"))
    const strings = sharedStringsRelation ? [...xlsxCardXml(await zip.read(sharedStringsRelation.target)).getElementsByTagNameNS("*", "si")].map(xlsxCardString) : []
    const sheets = [...workbook.getElementsByTagNameNS("*", "sheet")].map(sheet => {
        const name = sheet.getAttribute("name"), id = sheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") || sheet.getAttributeNS("http://purl.oclc.org/ooxml/officeDocument/relationships", "id") || sheet.getAttribute("r:id")
        return {name, relation: relations.get(id)}
    }).filter(sheet => sheet.relation?.type.endsWith("/worksheet"))
    if (!sheets.length) throw new Error("Excel に読み込めるシートがありません。")
    const canonical = sheets.find(sheet => sheet.name === "全カード")
    if (canonical) return normalizeCardLibraryRows(xlsxCardSheetRows(xlsxCardXml(await zip.read(canonical.relation.target)), strings), sourceName, canonical.name)
    for (const sheet of sheets) {
        const rows = xlsxCardSheetRows(xlsxCardXml(await zip.read(sheet.relation.target)), strings)
        if (rows.some(row => row.rowNumber <= 30 && xlsxCardHeaderColumns(row.values))) return normalizeCardLibraryRows(rows, sourceName, sheet.name)
    }
    throw new Error("カード一覧の列（仮ID・カード名・種類・クラス・Lv・Power）が見つかりません。")
}

function moveRaw(ids, player, destination, position = "last") {

    if (destination === "channel" || valid.some(id => where(id)?.zone === "channel")) throw new Error("チャンネルはデッキ編集で設定してください。")
    if (!playerIds.includes(player) || !zoneById(destination)) throw new Error("移動先のゾーンがありません。")
    const target = state.locations[player][destination]
    if (destination === "set" || destination === "stage") {

            const place = where(id)
            state.locations[place.player][place.zone].splice(place.index, 1)

function reorderZone(ids, player, zone, index, finalPosition = false) {

    if (!moving.length || moving.length !== chosen.size) return false
    const boundary = integer(index, 0, current.length, current.length)
    const remaining = current.filter(id => !chosen.has(id))
    const insertion = finalPosition ? Math.min(boundary, remaining.length)
        : boundary - current.slice(0, boundary).filter(id => chosen.has(id)).length
    const next = [...remaining.slice(0, insertion), ...moving, ...remaining.slice(insertion)]
    if (next.every((id, position) => id === current[position])) return false
    return transact(`${state.players[player].name}の${zoneById(zone).label}を並べ替え`, () => {
        state.locations[player][zone] = next

function moveCards(ids, player, destination, position = "last") {

function dropCardsAt(ids, player, destination, boundary, allowPileReorder = false) {

    if (destination === "channel" || ids.some(id => where(id)?.zone === "channel")) {
        notify("チャンネルはデッキ編集で設定してください。")
        return false
    }
    if (ids.some(id => colorForCard(id)) && destination !== "colorline" && !destination.startsWith("niji_")) {
        notify("カラーカードはカラーラインかにじエリアへ移動してください。")
        return false
    }
    const zone = zoneById(destination)
    const current = state.locations[player][destination]
    if (ids.every(id => where(id)?.player === player && where(id)?.zone === destination)) {
        if ((zone.mode === "pile" && !allowPileReorder) || destination === "set" || destination === "stage") return false
        return reorderZone(ids, player, destination, boundary)
    }
    if (destination === "set" || destination === "stage") return transact(`${ids.length}枚を${state.players[player].name}の${zone.label}へ移動`, () => moveRaw(ids, player, destination))

// Render short Blob URLs while keeping the original embedded images for saves.
const cardImageURLs = new Map()

function releaseCardImageURL(assetId) {
    const cached = cardImageURLs.get(assetId)
    if (!cached) return
    try { URL.revokeObjectURL(cached.url) } catch {}
    cardImageURLs.delete(assetId)
}

function cachedCardImageURL(assetId) {
    const data = typeof assetId === "string" && Object.hasOwn(assets, assetId) ? assets[assetId] : ""
    const cached = cardImageURLs.get(assetId)
    if (cached && cached.data === data) return cached.url
    if (cached) releaseCardImageURL(assetId)
    if (typeof data !== "string" || !data) return ""
    // Some non-browser runtimes lack these APIs. The embedded image still works.
    if (typeof atob !== "function" || typeof Blob !== "function" || typeof URL === "undefined" || typeof URL.createObjectURL !== "function" || typeof URL.revokeObjectURL !== "function") return data
    const match = data.length <= 4000000 && /^data:(image\/(?:png|jpeg|webp));base64,([A-Za-z0-9+/]+={0,2})$/.exec(data)
    if (!match) return data
    try {
        const decoded = atob(match[2])
        const bytes = new Uint8Array(decoded.length)
        for (let index = 0; index < decoded.length; index++) bytes[index] = decoded.charCodeAt(index)
        const url = URL.createObjectURL(new Blob([bytes], {type: match[1]}))
        cardImageURLs.set(assetId, {data, url})
        return url
    } catch {
        return data
    }
}

function pruneCardImageURLs() {
    for (const [assetId, cached] of cardImageURLs) {
        if (!Object.hasOwn(assets, assetId) || assets[assetId] !== cached.data) releaseCardImageURL(assetId)
    }
}

        byId("saveStatus").textContent = "自動保存は利用できません。JSON保存を使用してください。"
        return
    }
    byId("saveStatus").textContent = "このブラウザ内に保存中"
    const version = saveVersion
    saveTimer = setTimeout(() => {
        try {
            const transaction = database.transaction("boards", "readwrite")
            transaction.objectStore("boards").put(buildRecord(), "current")
            transaction.oncomplete = () => {
                if (version === saveVersion) byId("saveStatus").textContent = "このブラウザ内に保存済み / バックアップはJSON保存"
            }
            transaction.onerror = () => {byId("saveStatus").textContent = "自動保存に失敗しました。JSON保存を使用してください。"}
            transaction.onabort = transaction.onerror
        } catch (error) {
            console.error("Local save failed", error)
            byId("saveStatus").textContent = "自動保存に失敗しました。JSON保存を使用してください。"
        }

function initializeStorage() {
    try {
        const request = indexedDB.open("nijinana_manual_table_v1", 1)
        const timeout = setTimeout(() => {
            if (!database) byId("saveStatus").textContent = "自動保存を確認できません。JSON保存を使用してください。"
        }, 4000)
        request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains("boards")) request.result.createObjectStore("boards")
        }
        request.onerror = () => {
            clearTimeout(timeout)
            byId("saveStatus").textContent = "自動保存は利用できません。JSON保存を使用してください。"
        }
        request.onsuccess = () => {
            clearTimeout(timeout)
            database = request.result
            database.onversionchange = () => {database.close()}
            const read = database.transaction("boards", "readonly").objectStore("boards").get("current")
            read.onsuccess = () => {
                if (read.result && !ui.touched) {
                    try {
                        validateRecord(read.result)
                        const restoredState = upgradeLayout(copy(read.result.state))
                        checkState(restoredState, read.result.assets, true)
                        state = restoredState
                        assets = copy(read.result.assets)
                        restoreReplayFromBoard(read.result)
                        ui.movePlayer = state.active
                        render()
                        byId("saveStatus").textContent = "このブラウザ内の前回の盤面を復元"
                    } catch (error) {
                        console.error("Local restore failed", error)
                        byId("saveStatus").textContent = "前回の自動保存を復元できません。JSON読込を使用してください。"
                    }
                } else if (ui.touched) scheduleSave()
                else byId("saveStatus").textContent = "ブラウザ内保存が利用可能 / バックアップはJSON保存"
            }
            read.onerror = () => {byId("saveStatus").textContent = "前回の自動保存を取得できませんでした。"}
        }
    } catch (error) {
        console.error("Storage initialization failed", error)
        byId("saveStatus").textContent = "自動保存は利用できません。JSON保存を使用してください。"
    }
}

function imageData(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onerror = () => reject(new Error("Image file could not be read."))
        reader.onload = () => {
            const image = new Image()
            image.onerror = () => reject(new Error("Image could not be decoded."))
            image.onload = () => {
                if (!image.naturalWidth || !image.naturalHeight || image.naturalWidth * image.naturalHeight > 80000000) return reject(new Error("Invalid image dimensions."))
                const ratio = Math.min(1, 1200 / Math.max(image.naturalWidth, image.naturalHeight))
                const canvas = document.createElement("canvas")
                canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio))
                canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio))
                const context = canvas.getContext("2d")
                context.fillStyle = "#ffffff"
                context.fillRect(0, 0, canvas.width, canvas.height)
                context.drawImage(image, 0, 0, canvas.width, canvas.height)
                resolve(canvas.toDataURL("image/jpeg", 0.92))
            }
            image.src = reader.result
        }
        reader.readAsDataURL(file)
    })
}
async function importImages(files) {
    if (replay.mode !== "manual") return
    const replayEpoch = replay.epoch
    if (!files.length) return
    const valid = [...files]
    if (valid.length > 80 || valid.length + Object.values(state.catalog).filter(item => !isColorDefinition(item)).length > 500) return notify("画像は一度に80枚、登録合計500種類までです。", true)
    if (valid.some(file => !["image/png", "image/jpeg", "image/webp"].includes(file.type) || file.size > 10000000)) return notify("PNG・JPEG・WebPの各10MB以下の画像を選んでください。", true)
    notify("端末内で画像を変換しています。")
    try {
        const prepared = []
        for (const file of valid) prepared.push({name: file.name.replace(/\.[^.]+$/, "").slice(0, 200) || "カード", data: await imageData(file)})
        if (replayEpoch !== replay.epoch || replay.mode !== "manual") throw new Error("操作状態が変わったため、画像の登録を中止しました。")
        const usedAssets = new Set(Object.values(state.catalog).map(item => item.asset).filter(Boolean))
        const total = [...usedAssets].reduce((sum, id) => sum + assets[id].length, 0) + prepared.reduce((sum, item) => sum + item.data.length, 0)
        if (total > 80000000) throw new Error("Image collection exceeds the safe export limit.")
        const success = transact(`${prepared.length}種類のカード画像を登録`, () => {
            for (const item of prepared) {
                const assetId = uid("image")
                assets[assetId] = item.data
                state.catalog[uid("definition")] = {name: item.name, text: "", asset: assetId}
            }
        })
        if (!success) return
        if (modalKind === "catalog") showCatalog()
        notify(`${prepared.length}種類の画像を登録しました。デッキ編集で枚数を指定してください。`)
    } catch (error) {
        console.error("Image import failed", error)
        notify(`画像を読み込めませんでした。${error.message}`, true)
    }
}

            if (field === "cardType") syncCardDetailFields(item, id)
        }
    }
    else if (element.dataset.catalogName) {
        const name = element.value.trim()
        const id = element.dataset.catalogName
        if (!name) {element.value = state.catalog[id].name
            return notify("カード名は空にできません。", true)
        }
        transact("登録カードの名前を変更", () => {state.catalog[id].name = name})
    }
    else if (element.dataset.catalogText) {
        const text = element.value
        transact("登録カードの説明を変更", () => {state.catalog[element.dataset.catalogText].text = text})
    }
})

    const files = [...event.target.files]
    event.target.value = ""
    await importImages(files)
})
byId("statePicker").addEventListener("change", async event => {

byId("modal").addEventListener("close", () => {
    if (byId("modal").open) return
    modalKind = ""
    inspectContext = null
    previewCardId = null
    previewReturnContext = null
    replay.cutInEditor = null
    captureReplayFrame("山札の確認を終了")
})
document.addEventListener("dragstart", event => {
    if (replay.mode === "replay") {event.preventDefault(); return}
    const element = event.target.closest("[data-card-id]")
    if (!element) return
    const id = element.dataset.cardId
    if (!ui.selection.has(id)) ui.selection = new Set([id])
    event.dataTransfer.setData("text/plain", JSON.stringify(selectedIds()))
    event.dataTransfer.effectAllowed = "move"
    ui.dragging = true
})
let activeDropZone = null
let dropIndicator = null
function clearDropFeedback() {
    activeDropZone?.classList.remove("drag-over")
    activeDropZone = null
    dropIndicator?.remove()
    dropIndicator = null
}
function boardDropPosition(zone, event) {
    const player = zone.dataset.dropPlayer
    const zoneId = zone.dataset.dropZone
    const current = state.locations[player]?.[zoneId]
    const cardsBox = zone.querySelector(".zone-cards")
    if (!current || !cardsBox) return null
    if (zoneById(zoneId)?.mode === "pile") return {boundary: current.length, reference: null}
    const currentIds = new Set(current)
    const elements = [...cardsBox.querySelectorAll("[data-card-id]")]
        .filter(element => currentIds.has(element.dataset.cardId))
    if (!elements.length) return {boundary: 0, reference: null}
    const direction = getComputedStyle(cardsBox).flexDirection
    const vertical = direction.startsWith("column")
    const reverse = direction.endsWith("reverse")
    const coordinate = vertical ? event.clientY : event.clientX
    let boundary = elements.length
    for (let index = 0; index < elements.length; index += 1) {
        const rect = elements[index].getBoundingClientRect()
        const middle = vertical ? (rect.top + rect.bottom) / 2 : (rect.left + rect.right) / 2
        if (reverse ? coordinate > middle : coordinate < middle) {boundary = index; break}
    }
    return {boundary, reference: elements[Math.min(boundary, elements.length - 1)], before: boundary < elements.length, vertical, reverse}
}
function inspectorDropPosition(grid, event) {
    const elements = [...grid.querySelectorAll(".inspect-item")]
    const start = inspectContext.page * inspectorPageSize
    if (!elements.length) return {boundary: start, reference: null}
    const rows = []
    elements.forEach((element, index) => {
        const rect = element.getBoundingClientRect()
        let row = rows[rows.length - 1]
        if (!row || Math.abs(rect.top - row.top) > 6) {
            row = {top: rect.top, bottom: rect.bottom, start: index, end: index, elements: []}
            rows.push(row)
        }
        row.bottom = Math.max(row.bottom, rect.bottom)
        row.end = index + 1
        row.elements.push({element, rect})
    })
    let row = rows[rows.length - 1]
    for (let index = 0; index < rows.length - 1; index += 1) {
        if (event.clientY < (rows[index].bottom + rows[index + 1].top) / 2) {row = rows[index]; break}
    }
    let local = row.end
    for (let index = 0; index < row.elements.length; index += 1) {
        const rect = row.elements[index].rect
        if (event.clientX < (rect.left + rect.right) / 2) {local = row.start + index; break}
    }
    const reference = local < row.end ? elements[local] : elements[row.end - 1]
    return {boundary: start + local, reference, before: local < row.end, vertical: false, reverse: false}
}
function dropPosition(zone, event) {
    return zone.dataset.inspectorDrop === "true" ? inspectorDropPosition(zone, event) : boardDropPosition(zone, event)
}
function showDropIndicator(position, zone) {
    if (!position?.reference) {dropIndicator?.remove(); dropIndicator = null; return}
    if (!dropIndicator) {
        dropIndicator = document.createElement("div")
        dropIndicator.className = "drop-insertion-marker"
    }
    const parent = zone.dataset.inspectorDrop === "true" ? byId("modal") : document.body
    if (dropIndicator.parentElement !== parent) parent.appendChild(dropIndicator)
    const rect = position.reference.getBoundingClientRect()
    const before = position.before !== position.reverse
    if (position.vertical) {
        dropIndicator.style.left = `${rect.left}px`
        dropIndicator.style.top = `${(before ? rect.top : rect.bottom) - 2}px`
        dropIndicator.style.width = `${rect.width}px`
        dropIndicator.style.height = "4px"
    } else {
        dropIndicator.style.left = `${(before ? rect.left : rect.right) - 2}px`
        dropIndicator.style.top = `${rect.top}px`
        dropIndicator.style.width = "4px"
        dropIndicator.style.height = `${rect.height}px`
    }
}
function acceptCardDrop(event) {
    const zone = event.target.closest("[data-drop-zone]")
    if (!zone || !ui.dragging) return
    event.preventDefault()
    event.dataTransfer.dropEffect = "move"
    if (activeDropZone && activeDropZone !== zone) activeDropZone.classList.remove("drag-over")
    activeDropZone = zone
    zone.classList.add("drag-over")
    showDropIndicator(dropPosition(zone, event), zone)
}
document.addEventListener("dragenter", acceptCardDrop)
document.addEventListener("dragover", acceptCardDrop)
document.addEventListener("dragleave", event => {
    const zone = event.target.closest("[data-drop-zone]")
    if (zone && zone === activeDropZone && !zone.contains(event.relatedTarget)) clearDropFeedback()
})
document.addEventListener("dragend", () => {
    ui.dragging = false
    clearDropFeedback()
})
document.addEventListener("drop", event => {
    if (replay.mode === "replay") return
    const zone = event.target.closest("[data-drop-zone]")
    if (!zone || !ui.dragging) return
    event.preventDefault()
    const position = dropPosition(zone, event)
    ui.dragging = false
    clearDropFeedback()
    try {
        const ids = JSON.parse(event.dataTransfer.getData("text/plain"))
        if (!Array.isArray(ids) || !ids.every(id => typeof id === "string" && Object.hasOwn(state.cards, id))) return
        ui.selection = new Set(ids)
        ui.movePlayer = zone.dataset.dropPlayer
        ui.tab = "selection"
        if (!dropCardsAt([...new Set(ids)], zone.dataset.dropPlayer, zone.dataset.dropZone, position.boundary, zone.dataset.inspectorDrop === "true")) refreshSelectionUI()
    } catch (error) {
        console.error("Drag operation failed", error)
        notify("カードを移動できませんでした。", true)
    }
})
document.addEventListener("scroll", () => {if (replay.mode === "replay") positionReplayCutIn()}, true)
globalThis.addEventListener?.("resize", () => {if (replay.mode === "replay") positionReplayCutIn()})
document.addEventListener("keydown", event => {
    const editing = event.target.matches("input, textarea, select, [contenteditable=true]")
    if (editing || byId("modal").open) return
    const key = event.key.toLowerCase()
    const modifier = event.ctrlKey || event.metaKey
    if (replay.mode === "replay") {
        if (key === " " && !event.target.matches("button")) {event.preventDefault(); toggleReplayPlayback()}
        else if (key === "arrowleft") {event.preventDefault(); seekReplay(replay.index - 1)}
        else if (key === "arrowright") {event.preventDefault(); seekReplay(replay.index + 1)}
        return
    }
    if (modifier && key === "s") {event.preventDefault()
        saveJSON()
    }
    else if (modifier && key === "z") {event.preventDefault()
        if (event.shiftKey) redo()
        else undo()
    }
    else if (modifier && key === "x") {event.preventDefault()
        redo()
    }
    else if (!modifier && !event.altKey && key === "d") draw()
    else if (!modifier && !event.altKey && key === "r") operateSelection("rotate")
    else if (!modifier && !event.altKey && key === "f") operateSelection("flip")
    else if (key === "escape") {ui.selection.clear()
        render()
    }
})
render()
initializeStorage()

</script>
